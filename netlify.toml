[build]
command = "pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "22.13.0"
PNPM_VERSION = "11.19.0"

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' mailto:; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; frame-src https://www.google.com; connect-src 'self'; upgrade-insecure-requests"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
for = "/_next/static/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"

  [headers.values]
  Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
